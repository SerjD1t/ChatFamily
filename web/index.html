<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315a4c"><link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css"><title>Семейный чат</title>
</head>
<body>
  <main>
    <section id="login" class="card">
      <h1>Семейный чат</h1><p>Войдите в свой семейный круг.</p>
      <form id="loginForm" method="post" action="/login"><label>Эл. почта<input id="email" name="email" type="email" autocomplete="email" required></label><label>Пароль<input id="password" name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form><p><button id="openAcceptInvite" type="button" class="secondary">Есть одноразовый код?</button></p><p id="error" role="alert"></p>
    </section>
    <section id="app" hidden>
      <header><h1>Чат</h1><div class="headerActions"><button id="openUserMenu" class="secondary iconButton" title="Меню пользователя" aria-label="Меню пользователя">⋯</button></div></header>
      <div class="layout"><aside><h2>Диалоги</h2><nav id="conversations" aria-label="Список диалогов"></nav><button id="newGroup" class="secondary">＋ Группа</button></aside>
      <section class="chat"><div class="chatHead"><h2 id="chatTitle">Выберите чат</h2><div class="chatActions"><button id="toggleFavorite" class="secondary iconButton" hidden title="Добавить в избранное" aria-label="Добавить в избранное">☆</button><button id="manageMembers" class="secondary iconButton" hidden title="Участники" aria-label="Участники">👥</button><button id="deleteGroup" class="secondary iconButton" hidden title="Удалить группу" aria-label="Удалить группу">🗑</button></div></div><div id="messages" aria-live="polite"></div><p id="replyPreview" class="muted" hidden></p><form id="composer"><input id="attachmentFiles" type="file" multiple hidden><textarea id="body" maxlength="4000" rows="3" placeholder="Напишите сообщение" aria-label="Текст сообщения"></textarea><button id="sendButton" class="sendButton" aria-label="Отправить сообщение" title="Отправить сообщение"></button></form><div id="sendMenu" class="sendMenu" hidden><button id="attach" type="button" class="secondary" title="Вложить файл">📎 Вложить файл</button><button id="emoji" type="button" class="secondary" title="Добавить смайл">😊 Смайлы</button></div><div id="emojiBar" class="emojiBar" hidden><button type="button">😀</button><button type="button">❤️</button><button type="button">👍</button><button type="button">🎉</button><button type="button">😂</button></div><p id="attachmentList" class="muted"></p><div id="reactionPicker" class="reactionPicker" hidden><button data-emoji="👍">👍</button><button data-emoji="❤️">❤️</button><button data-emoji="😂">😂</button><button data-emoji="🎉">🎉</button><button data-emoji="😢">😢</button></div></section></div>
    </section>
  </main>
  <dialog id="acceptInviteDialog"><form id="acceptInvite" class="admin"><h2>Принять приглашение</h2><p class="muted">Введите одноразовый код, который прислал администратор.</p><label>Одноразовый код<input id="inviteCode" autocomplete="one-time-code" required></label><label>Ваше имя<input id="inviteName" maxlength="120" autocomplete="name" required></label><label>Новый пароль<input id="invitePassword" type="password" minlength="5" autocomplete="new-password" required></label><label>Повторите пароль<input id="invitePasswordRepeat" type="password" minlength="5" autocomplete="new-password" required></label><p id="acceptInviteError" class="error" role="alert"></p><p class="actions"><button id="closeAcceptInvite" type="button" class="secondary">Отмена</button><button>Создать аккаунт</button></p></form></dialog>
  <dialog id="groupDialog"><form method="dialog"><h2>Новая группа</h2><label>Название<input id="groupTitle" maxlength="120" required></label><p class="actions"><button value="cancel" class="secondary">Отмена</button><button id="createGroup" value="default">Создать</button></p></form></dialog>
  <dialog id="userMenuDialog"><form method="dialog" class="userMenu"><h2 id="currentUserName">Пользователь</h2><button id="pushSettings" type="button" class="secondary" hidden>Уведомления</button><button id="administration" type="button" class="secondary" hidden>Администрирование</button><button id="logout" type="button" class="secondary">Выйти</button><button value="cancel">Закрыть</button></form></dialog>
  <dialog id="adminDialog"><form method="dialog" class="admin"><h2>Пользователи</h2><ul id="users"></ul><h2>Пригласить пользователя</h2><label>Email<input id="inviteEmail" type="email" required></label><fieldset><legend>Права</legend><label><input name="permission" type="checkbox" value="manage_users"> Администратор — управление пользователями и приглашениями</label><label><input name="permission" type="checkbox" value="send_messages" checked> Отправка сообщений</label><label><input name="permission" type="checkbox" value="edit_own_messages" checked> Изменение своих сообщений</label><label><input name="permission" type="checkbox" value="delete_own_messages" checked> Удаление своих сообщений</label><label><input name="permission" type="checkbox" value="create_groups"> Создание групп</label></fieldset><p id="inviteError" class="error"></p><p id="inviteToken" class="token" hidden></p><p class="actions"><button value="cancel" formnovalidate class="secondary">Закрыть</button><button id="createInvite" value="default">Создать приглашение</button></p></form></dialog>
  <dialog id="membersDialog"><form method="dialog" class="admin"><h2>Участники группы</h2><ul id="groupMembers"></ul><label>Добавить пользователя<select id="memberSelect"></select></label><p id="memberError" class="error"></p><p class="actions"><button value="cancel" class="secondary">Закрыть</button><button id="addMember" value="default">Добавить</button></p></form></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
